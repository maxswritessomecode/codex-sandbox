[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-profile"
version = "0.3.0"
description = "Named configuration profiles and workspaces for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "maxswritessomecode" }
]
keywords = ["claude", "codex", "agents", "profiles", "skills", "mcp", "plugins"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/maxswritessomecode/agent-profile"
Repository = "https://github.com/maxswritessomecode/agent-profile"
Issues = "https://github.com/maxswritessomecode/agent-profile/issues"

[project.scripts]
agent-profile = "agent_profile:main"
codex-sandbox = "agent_profile:main"

[tool.setuptools]
py-modules = ["agent_profile"]
